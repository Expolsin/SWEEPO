<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="CLEANIFY — profesionální úklid bytů a domů v Praze. Rychlá nezávazná poptávka, orientační cena hned." />
    <title>CLEANIFY | Úklid Praha — Domů se vracejte odpočívat</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200..800&family=Playfair+Display:wght@400..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200..800&family=Playfair+Display:wght@400..900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200..800&family=Playfair+Display:wght@400..900&display=swap" /></noscript>
  </head>
  <body>
    <!-- Static form blueprint for Netlify build-time form detection. -->
    <form name="cleanify-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="cleanify-inquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="propertyType" />
      <input type="text" name="size" />
      <input type="text" name="sizeM2" />
      <input type="text" name="frequency" />
      <input type="text" name="windows" />
      <input type="text" name="ovens" />
      <input type="text" name="ironingHours" />
      <input type="text" name="preferredDate" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="street" />
      <input type="text" name="houseNumber" />
      <input type="text" name="district" />
      <input type="text" name="submittedAt" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
